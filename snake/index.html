<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Crescendo Minha Cobra</title>
</head>
<body>
    <h1>Crescendo Minha Cobra</h1>
    <p>Use as setas ou WASD. Pausa: Espaço. Reiniciar: R</p>

    <div class="HUD">
        <span>Pontos: <strong id="score">0</strong></span>
        <span>Recorde: <strong id="snake-best">0</strong></span>
        <span>Estado: <strong id="state">PRONTO</strong></span>
    </div>
    <canvas id="game" width="380" height="380" aria-label="Área do jogo da cobra">
    </canvas>
    <p class="hint">Coma as maçãs. Evite as paredes e o prórpio corpo</p>
    <script src="script.js"></script>
</body>
</html>
